services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-emaecom}
      POSTGRES_USER: ${DB_USER:-ema}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ema}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ema}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ema-ecom-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/${DB_NAME:-emaecom}}
      DB_USER: ${DB_USER:-ema}
      DB_PASSWORD: ${DB_PASSWORD:-ema}

      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_ISSUER: ema-ecom

      SERVER_FORWARD_HEADERS_STRATEGY: framework
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dashkod.com,https://www.dashkod.com}

      APP_MASTER_KEY: ${APP_MASTER_KEY:-local-dev-master-key}

      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-ema-ecom}
      APP_MINIO_PUBLIC_BASE_URL: ${APP_MINIO_PUBLIC_BASE_URL:-https://s3.yourdomain.com/${APP_MINIO_BUCKET:-ema-ecom}}

    expose:
      - "8080"

    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ema-ecom-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

    expose:
      - "80"

    networks:
      - internal
      - coolify

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"

      # ROUTER RULES
      - "traefik.http.routers.dashkod.rule=Host(`dashkod.com`) || Host(`www.dashkod.com`)"
      - "traefik.http.routers.dashkod.entrypoints=https"
      - "traefik.http.routers.dashkod.tls=true"
      - "traefik.http.routers.dashkod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashkod.service=dashkod"

      # FORCE TRAEFIK TO USE PORT 80 INSIDE CONTAINER (Nginx)
      - "traefik.http.services.dashkod.loadbalancer.server.port=80"

      # OPTIONAL: redirect http -> https (only if you also want port 80 routing)
      - "traefik.http.routers.dashkod-http.rule=Host(`dashkod.com`) || Host(`www.dashkod.com`)"
      - "traefik.http.routers.dashkod-http.entrypoints=http"
      - "traefik.http.routers.dashkod-http.middlewares=redirect-to-https"
      - "traefik.http.routers.dashkod-http.service=dashkod"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

volumes:
  db_data:
  minio_data:

networks:
  internal:
    driver: bridge

  # This MUST match the external Coolify proxy network name
  coolify:
    external: true
